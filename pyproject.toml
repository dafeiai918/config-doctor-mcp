[project]
name = "config-doctor-mcp"
version = "1.0.0"
description = "AI 客户端配置诊断 MCP：扫描配置 / 查 /v1 错误 / 检查明文密钥"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
config-doctor-mcp = "config_doctor_mcp:main"

[project.urls]
Homepage = "https://github.com/dafeiai918/config-doctor-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["config_doctor_mcp.py"]
